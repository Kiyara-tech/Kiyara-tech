<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>courtyard 🎾 | Premium 3D Global Matcher</title>
    <!-- Three.js & Globe.gl -->
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        :root { 
            --accent-glow: #ffffff;
            --bg-dark: #020617; 
        }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: #f8fafc; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* 顶部 Header */
        header { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(2, 6, 23, 0.85), transparent); pointer-events: none; }
        
        /* Brand Logo 颜色修改：微渐变与高品质发光 */
        .logo { font-size: 1.9rem; font-weight: 800; background: linear-gradient(135deg, #34d399 0%, #fbbf24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; filter: drop-shadow(0 2px 8px rgba(52, 211, 153, 0.3)); pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .logo span.icon { font-size: 1.6rem; -webkit-text-fill-color: initial; }

        .btn-status { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #f8fafc; padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; cursor: pointer; backdrop-filter: blur(12px); pointer-events: auto; transition: all 0.3s ease; }
        .btn-status:hover { background: rgba(255, 255, 255, 0.2); border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }

        /* 地球画布 */
        #globeViz { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 右侧可折叠信息栏 */
        .sidebar-container { position: absolute; right: 28px; top: 90px; z-index: 20; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .sidebar { width: 340px; max-height: calc(100vh - 140px); background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 20px; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); transition: all 0.3s ease; }
        
        /* 折叠收起状态下的样式 */
        .sidebar-container.collapsed .sidebar { opacity: 0; pointer-events: none; transform: scale(0.95) translateX(20px); height: 0; padding: 0; border: none; }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .sidebar-title { font-size: 0.85rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.2px; }
        
        /* 折叠切换按钮 */
        .toggle-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #e2e8f0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; pointer-events: auto; }
        .toggle-btn:hover { background: rgba(255, 255, 255, 0.25); color: #fff; transform: scale(1.05); }

        /* 球友卡片 */
        .player-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s ease; }
        .player-card:hover, .player-card.active { border-color: rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.1); }
        
        .player-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .player-name { font-weight: 700; font-size: 1.05rem; color: #ffffff; }
        .ntpr-badge { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); color: #fbbf24; font-weight: 800; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }
        
        .player-info { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; margin-bottom: 12px; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { background: rgba(255, 255, 255, 0.06); color: #94a3b8; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .tag-host { background: rgba(52, 211, 153, 0.15); color: #34d399; border-color: rgba(52, 211, 153, 0.3); }

        /* 隐藏滚动条 */
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span class="icon">🎾</span>courtyard</div>
        <button class="btn-status" onclick="shareLocation()">📍 Share Staycation Location</button>
    </header>

    <div id="globeViz"></div>

    <!-- 可折叠侧边栏容器 -->
    <div class="sidebar-container" id="sidebarContainer">
        <div class="sidebar-header" style="justify-content: flex-end; margin-bottom: 8px;">
            <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()" title="Toggle Panel">—</button>
        </div>
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Live Staycation Players</span>
            </div>
            <div id="playerList"></div>
        </div>
    </div>

    <script>
        // 示例数据：增加国家 ISO 3 位代码 (ISO_A3) 用于精确高亮轮廓
        const playersData = [
            { id: 1, name: "Kiya 🇲🇴", iso: "MAC", lat: 22.1987, lng: 113.5439, ntpr: "3.5", location: "Macao (Cotai)", desc: "Local court booking access available. Looking for singles or doubles.", tags: ["Court Host", "Português", "English"] },
            { id: 2, name: "Lucas 🇧🇷", iso: "BRA", lat: -23.5505, lng: -46.6333, ntpr: "4.0", location: "São Paulo", desc: "Travelling for business. Looking for a high-intensity rally tonight!", tags: ["Seeker", "Português", "Rally"] },
            { id: 3, name: "Sofia 🇵🇹", iso: "PRT", lat: 38.7223, lng: -9.1393, ntpr: "3.0", location: "Lisbon", desc: "Local player with private clay court access. Free on weekends.", tags: ["Court Host", "Português", "English"] },
            { id: 4, name: "Kenji 🇯🇵", iso: "JPN", lat: 35.6762, lng: 139.6503, ntpr: "4.5", location: "Tokyo (Shinjuku)", desc: "Staycationer seeking competitive matches. Advanced level.", tags: ["Seeker", "English"] }
        ];

        let selectedISO = "MAC"; // 默认聚焦并高亮澳门所在区域
        let globeInstance;

        // 加载包含全球所有国家/地区真实边界轮廓的 GeoJSON 矢量数据
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(countries => {
                
                globeInstance = Globe()
                    (document.getElementById('globeViz'))
                    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
                    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                    .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                    
                    /* 1. 地球国家矢量轮廓高亮逻辑 */
                    .polygonsData(countries.features)
                    .polygonCapColor(feat => {
                        // 如果是被选中的国家/地区，呈现高透明度柔和亮白光，未选中则透明
                        const iso = feat.properties.ISO_A3 || feat.properties.ADM0_A3;
                        return iso === selectedISO ? 'rgba(255, 255, 255, 0.18)' : 'rgba(0, 0, 0, 0)';
                    })
                    .polygonSideColor(() => 'rgba(255, 255, 255, 0.05)')
                    .polygonStrokeColor(feat => {
                        // 选中的国家/地区边缘显示高亮白光轮廓线
                        const iso = feat.properties.ISO_A3 || feat.properties.ADM0_A3;
                        return iso === selectedISO ? '#ffffff' : 'rgba(255, 255, 255, 0.08)';
                    })
                    .polygonAltitude(feat => {
                        const iso = feat.properties.ISO_A3 || feat.properties.ADM0_A3;
                        return iso === selectedISO ? 0.015 : 0.005;
                    })

                    /* 2. 精致微发光节点 (代替生硬大斑点) */
                    .htmlElementsData(playersData)
                    .htmlElement(d => {
                        const el = document.createElement('div');
                        el.innerHTML = `
                            <div style="width:12px; height:12px; background:#ffffff; border-radius:50%; box-shadow:0 0 15px 4px rgba(255,255,255,0.9); cursor:pointer; transform:translate(-50%, -50%); border:2px solid #34d399;"></div>
                        `;
                        el.onclick = () => focusPlayer(d.id);
                        return el;
                    });

                // 控制视角
                globeInstance.controls().autoRotate = true;
                globeInstance.controls().autoRotateSpeed = 0.5;

                // 初始化飞行至第一个玩家 (Kiya - Macao)
                setTimeout(() => focusPlayer(1), 800);
            });

        // 渲染右侧面板列表
        const listContainer = document.getElementById('playerList');
        playersData.forEach(p => {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.id = `card-${p.id}`;
            card.onclick = () => focusPlayer(p.id);
            card.innerHTML = `
                <div class="player-top">
                    <span class="player-name">${p.name}</span>
                    <span class="ntpr-badge">NTPR ${p.ntpr}</span>
                </div>
                <div class="player-info">📍 ${p.location}<br>${p.desc}</div>
                <div class="tags">
                    ${p.tags.map(t => `<span class="tag ${t.includes('Host')?'tag-host':''}">${t}</span>`).join('')}
                </div>
            `;
            listContainer.appendChild(card);
        });

        // 聚焦球友：触发 3D 平滑旋转 + 刷新目标国家白光轮廓高亮
        function focusPlayer(id) {
            const p = playersData.find(item => item.id === id);
            if (!p || !globeInstance) return;

            selectedISO = p.iso;
            
            // 刷新多边形高亮轮廓
            globeInstance.polygonsData(globeInstance.polygonsData());

            // 暂停自动自转并平滑聚焦飞行
            globeInstance.controls().autoRotate = false;
            globeInstance.pointOfView({ lat: p.lat, lng: p.lng, altitude: 1.6 }, 1800);

            // 卡片选中态切换
            document.querySelectorAll('.player-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${id}`);
            if (activeCard) {
                activeCard.classList.add('active');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // 折叠 / 展开右侧面板
        let isCollapsed = false;
        function toggleSidebar() {
            const container = document.getElementById('sidebarContainer');
            const btn = document.getElementById('toggleBtn');
            isCollapsed = !isCollapsed;
            
            if (isCollapsed) {
                container.classList.add('collapsed');
                btn.innerHTML = '+';
                btn.title = "Expand Panel";
            } else {
                container.classList.remove('collapsed');
                btn.innerHTML = '—';
                btn.title = "Collapse Panel";
            }
        }

        // 共享实时定位
        function shareLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    
                    globeInstance.controls().autoRotate = false;
                    globeInstance.pointOfView({ lat, lng, altitude: 1.4 }, 2000);
                    alert("📍 Located your staycation position! Broadcasted onto the 3D Globe.");
                });
            }
        }
    </script>
</body>
</html>
